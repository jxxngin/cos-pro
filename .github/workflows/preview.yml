# PR마다 미리보기를 https://jxxngin.github.io/cos-pro/pr-preview/pr-<번호>/ 에 배포하고,
# PR에 링크 댓글을 단다. PR이 머지되거나 닫히면 미리보기를 지운다.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  pages: write

# deploy.yml과 같은 그룹을 써서 gh-pages 푸시를 한 번에 하나씩 실행한다.
# queue: max — PR 종료(미리보기 정리) 실행이 대기 중에 main 배포에 밀려 취소되지 않게 한다.
concurrency:
  group: pages-deploy
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      # GITHUB_TOKEN으로 한 푸시는 Pages 빌드를 시작하지 않으므로 빌드를 직접 요청한다.
      # 미리보기 배포와 정리(PR 종료) 모두에 필요하다.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
