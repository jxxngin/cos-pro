# PR마다 미리보기를 https://jxxngin.github.io/cos-pro/pr-preview/pr-<번호>/ 에 배포하고,
# PR에 링크 댓글을 단다. PR이 머지되거나 닫히면 미리보기를 지운다.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  pages: write

# deploy.yml과 같은 그룹을 써서 gh-pages 푸시를 한 번에 하나씩 실행한다.
# queue: max — PR 종료(미리보기 정리) 실행이 대기 중에 main 배포에 밀려 취소되지 않게 한다.
concurrency:
  group: pages-deploy
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      # 대기열 순서나 재실행 때문에 이벤트가 늦게 실행될 수 있으므로,
      # 실행 직전에 PR의 "지금" 상태를 보고 할 일을 정한다.
      #   - 배포: PR이 열려 있고, 이 이벤트의 head SHA가 지금의 head와 같을 때만
      #   - 정리: PR이 지금도 닫혀 있을 때만
      #   - 그 밖에는 건너뜀 (더 새로운 실행이 처리한다)
      - name: Check current PR state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          read -r state head < <(gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"')
          if [ "$EVENT_ACTION" = "closed" ]; then
            if [ "$state" = "closed" ]; then action=remove; else action=skip; fi
          else
            if [ "$state" = "open" ] && [ "$head" = "$EVENT_SHA" ]; then action=deploy; else action=skip; fi
          fi
          echo "event=$EVENT_ACTION event_sha=$EVENT_SHA current_state=$state current_head=$head -> $action"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.action != 'skip'

      - name: Deploy or remove PR preview
        if: steps.check.outputs.action != 'skip'
        uses: rossjrw/pr-preview-action@v1
        with:
          action: ${{ steps.check.outputs.action }}
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      # GITHUB_TOKEN으로 한 푸시는 Pages 빌드를 시작하지 않으므로 빌드를 직접 요청한다.
      # 미리보기 배포와 정리(PR 종료) 모두에 필요하다.
      - name: Request Pages build
        if: steps.check.outputs.action != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
